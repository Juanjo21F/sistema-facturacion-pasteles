spring.application.name=facturacion-pasteles
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never

# ---- Base de datos por defecto: H2 en memoria (modo PostgreSQL) para desarrollo ----
spring.datasource.url=jdbc:h2:mem:pasteleria;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# El esquema lo controla db/schema.sql (no Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# ---- authcore-service ----
# true  = usa un authcore SIMULADO (tokens admin-token / empleado-token). SOLO desarrollo.
# false = usa el authcore-service real (configurar base-url y validate-path).
authcore.mock.enabled=${AUTHCORE_MOCK_ENABLED:true}
authcore.base-url=${AUTHCORE_BASE_URL:http://localhost:9000}
authcore.validate-path=${AUTHCORE_VALIDATE_PATH:/api/auth/validate}
authcore.timeout-ms=${AUTHCORE_TIMEOUT_MS:2000}

