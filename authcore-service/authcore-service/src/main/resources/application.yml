server:
  port: 8081

spring:
  application:
    name: authcore-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/authcore_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:1312}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

authcore:
  jwt:
    secret: ${JWT_SECRET:cambia-este-secreto-por-uno-largo-y-aleatorio-de-al-menos-32-bytes}
    expiration-ms: 3600000
